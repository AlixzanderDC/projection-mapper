<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sphere wrap test</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px system-ui, sans-serif; }
  .row { display: flex; gap: 8px; padding: 8px; flex-wrap: wrap; }
  figure { margin: 0; }
  canvas { display: block; background: #000; }
  figcaption { padding: 4px 0; color: #aaa; }
</style>
</head>
<body>
<p style="padding:8px 8px 0">Three projectors round one ball, 120° apart, sharing one 2:1 strip. Each view shows what that projector throws; the graticule lines must line up on the ball and the lettering must read the right way round. The last view is projector 1 with a flat picture under an additive 360° layer.</p>
<div class="row" id="views"></div>
<figure style="padding:8px"><canvas id="strip" width="1024" height="512"></canvas><figcaption>The source strip (2:1 equirectangular).</figcaption></figure>
<script type="module">
import * as C from './js/core.js';
import { Renderer, drawOverlay } from './js/render.js';

// --- a labelled strip: longitude every 30°, latitude every 30°, banner on the equator, arrow pointing right
const strip = document.getElementById('strip'), g = strip.getContext('2d');
const SW = strip.width, SH = strip.height;
const grad = g.createLinearGradient(0, 0, SW, 0);
grad.addColorStop(0, '#1a2a6c'); grad.addColorStop(0.5, '#b21f1f'); grad.addColorStop(1, '#fdbb2d');
g.fillStyle = grad; g.fillRect(0, 0, SW, SH);
g.strokeStyle = 'rgba(255,255,255,0.6)'; g.lineWidth = 2;
for (let i = 0; i <= 12; i++) { const x = i / 12 * SW; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, SH); g.stroke(); }
for (let j = 0; j <= 6; j++) { const y = j / 6 * SH; g.beginPath(); g.moveTo(0, y); g.lineTo(SW, y); g.stroke(); }
g.fillStyle = '#fff'; g.font = 'bold 28px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
for (let i = 0; i < 12; i++) { const lon = (i - 6) * 30; g.fillText(`${lon}°`, (i + 0.5) / 12 * SW, SH * 0.2); }
g.font = 'bold 44px system-ui, sans-serif';
g.fillText('ARKHAM ASYLUM', SW * 0.5, SH * 0.5);
g.fillText('WARD J ➜', SW * 0.83, SH * 0.5);
g.fillText('➜ CRYO WING', SW * 0.17, SH * 0.5);
g.font = 'bold 30px system-ui, sans-serif';
g.fillText('TOP (north pole)', SW * 0.5, SH * 0.06); g.fillText('BOTTOM (south pole)', SW * 0.5, SH * 0.94);

// --- state: three 960×540 outputs (same geometry as 1920×1080 at half size), ball filling 90 % of the height
const state = C.defaultState();
state.media.push({ id: 'strip', name: 'strip', kind: 'image' });
function addOutput(az, extraFlat) {
  const o = C.makeOutput(state.outputs.length + 1);
  o.name = `Projector ${state.outputs.length + 1} (${az}°)`;
  o.width = 960; o.height = 540;
  o.template.throwRatio = 1.3; o.template.lensOffset = 1.0;
  o.template.distanceFt = C.templateDistanceFor(o, 0.9);
  state.outputs.push(o);
  if (extraFlat) {
    C.applyOp(state, { type: 'surfaceFromTemplate', outputId: o.id });  // flat, circle-masked checkerboard
    o.surfaces[0].fill = 'source';
  }
  C.applyOp(state, { type: 'surfaceFromTemplate', outputId: o.id, kind: 'sphere' });
  const s = o.surfaces[o.surfaces.length - 1];
  s.mediaId = 'strip'; s.fill = 'source'; s.sphere.az = az; s.additive = !!extraFlat;
  return o;
}
addOutput(0); addOutput(120); addOutput(240); addOutput(0, true);

// --- render
const views = document.getElementById('views');
const renders = [];
for (const o of state.outputs) {
  const fig = document.createElement('figure');
  const cv = document.createElement('canvas'); cv.width = o.width; cv.height = o.height;   // WebGL, kept off-screen
  const shown = document.createElement('canvas'); shown.width = o.width; shown.height = o.height;  // 2D copy (screenshots and headless Chrome show it reliably)
  const ov = document.createElement('canvas'); ov.width = o.width; ov.height = o.height; ov.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none';
  const wrap = document.createElement('div'); wrap.style.cssText = 'position:relative;width:' + o.width + 'px'; wrap.append(shown, ov);
  const cap = document.createElement('figcaption'); cap.textContent = o.name;
  fig.append(wrap, cap); views.append(fig);
  const r = new Renderer(cv), gl = r.gl;
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, strip);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  drawOverlay(ov.getContext('2d'), o, state, o.width, o.height);
  const sctx = shown.getContext('2d');
  const draw = () => { r.render(o, state, { texture: id => id === 'strip' ? { tex: t } : null }); sctx.drawImage(cv, 0, 0); };
  renders.push(draw);
  (window.__views ||= []).push({ r, cv, shown, draw, o });
}
// keep drawing: a WebGL canvas without preserveDrawingBuffer goes blank when the page is re-composited
(function loop() { for (const f of renders) f(); window.sphereTestDone = true; requestAnimationFrame(loop); })();
</script>
</body>
</html>
