const WALL = '94.5,1.5;126.9,1.5;159.4,1.5;191.9,1.5;224.4,1.5;256.9,1.5;289.5,1.5;322.1,1.5;354.6,1.5;387.2,1.5;419.9,1.5;452.5,1.5;485.2,1.5;517.9,1.5;550.6,1.5;583.3,1.5;616.1,1.5;648.8,1.5;681.6,1.5;714.4,1.5;747.3,1.5;780.1,1.5;813.0,1.5;845.9,1.5;878.8,1.5;911.7,1.5;944.7,1.5;977.6,1.5;1010.6,1.5;1043.6,1.5;1076.7,1.5;1109.7,1.5;1142.8,1.5;1175.9,1.5;1209.0,1.5;1242.1,1.5;1275.3,1.5;1308.4,1.5;1341.6,1.5;1374.8,1.5;1408.1,1.5;1441.3,1.5;1474.6,1.5;1507.9,1.5;1541.2,1.5;1574.5,1.5;1607.9,1.5;1641.3,1.5;1674.7,1.5;1674.3,23.7;1674.0,45.9;1673.7,68.1;1673.4,90.2;1673.1,112.4;1672.8,134.6;1672.4,156.7;1672.1,178.8;1671.8,201.0;1671.5,223.1;1671.2,245.2;1670.8,267.3;1670.5,289.4;1670.2,311.5;1669.9,333.6;1669.6,355.7;1669.2,377.8;1668.9,399.9;1668.6,421.9;1668.3,444.0;1668.0,466.0;1667.7,488.1;1667.3,510.1;1667.0,532.1;1666.7,554.1;1666.4,576.2;1666.1,598.2;1665.8,620.2;1665.4,642.1;1665.1,664.1;1664.8,686.1;1664.5,708.1;1664.2,730.0;1663.8,752.0;1663.5,774.0;1663.2,795.9;1662.9,817.8;1662.6,839.8;1662.3,861.7;1662.0,883.6;1661.6,905.5;1661.3,927.4;1661.0,949.3;1660.7,971.2;1660.4,993.0;1660.1,1014.9;1659.7,1036.8;1659.4,1058.6;1626.3,1058.3;1593.2,1058.0;1560.1,1057.7;1527.0,1057.4;1494.0,1057.0;1460.9,1056.7;1427.9,1056.4;1394.9,1056.1;1361.9,1055.8;1329.0,1055.4;1296.0,1055.1;1263.1,1054.8;1230.2,1054.5;1197.4,1054.2;1164.5,1053.8;1131.7,1053.5;1098.9,1053.2;1066.1,1052.9;1033.3,1052.5;1000.5,1052.2;967.8,1051.9;935.1,1051.6;902.4,1051.3;869.7,1051.0;837.1,1050.6;804.4,1050.3;771.8,1050.0;739.2,1049.7;706.6,1049.4;674.1,1049.1;641.6,1048.7;609.0,1048.4;576.5,1048.1;544.1,1047.8;511.6,1047.5;479.2,1047.2;446.8,1046.8;414.4,1046.5;382.0,1046.2;349.6,1045.9;317.3,1045.6;284.9,1045.3;252.7,1045.0;220.4,1044.6;188.1,1044.3;155.9,1044.0;123.6,1043.7;91.4,1043.4;91.5,1021.9;91.5,1000.3;91.6,978.7;91.7,957.2;91.7,935.6;91.8,914.0;91.9,892.4;91.9,870.8;92.0,849.2;92.1,827.6;92.1,806.0;92.2,784.4;92.2,762.8;92.3,741.1;92.4,719.5;92.4,697.9;92.5,676.2;92.6,654.5;92.6,632.9;92.7,611.2;92.8,589.5;92.8,567.8;92.9,546.1;93.0,524.4;93.0,502.7;93.1,481.0;93.1,459.3;93.2,437.6;93.3,415.8;93.3,394.1;93.4,372.3;93.5,350.6;93.5,328.8;93.6,307.0;93.7,285.3;93.7,263.5;93.8,241.7;93.8,219.9;93.9,198.1;94.0,176.3;94.0,154.4;94.1,132.6;94.2,110.8;94.2,89.0;94.3,67.1;94.3,45.2;94.4,23.4'.split(';').map(p => p.split(',').map(Number));   // the background surface's outline
const WALL_BOTTOM = x => 1043 + (x - 91) / (1659 - 91) * (1059 - 1043);
const CENTER = [918, 538];
const ARMS = [
  [[690, 1043], CENTER, [1132, 70]],   // bottom-left -> top-right
  [[1118, 1051], CENTER, [732, 64]],   // bottom-right -> top-left
];

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const easeOut = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
const lerp = (a, b, t) => a + (b - a) * t;

// ---- build strands (polylines along the arms with seeded wiggle)
const N = 420;
function buildStrand(arm, seed, amp, startDelay, growDur, baseWidth) {
  const r = mulberry32(seed);
  const f1 = 2 + r() * 2, f2 = 5 + r() * 4, p1 = r() * 6.28, p2 = r() * 6.28, side = r() < 0.5 ? -1 : 1;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const s = i / N;
    const seg = s < 0.5 ? 0 : 1, ls = (s - seg * 0.5) * 2;
    const a = arm[seg], b = arm[seg + 1];
    const x = lerp(a[0], b[0], ls), y = lerp(a[1], b[1], ls);
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    const nx = -dy / L, ny = dx / L;
    const pinch = 1 - 0.7 * Math.exp(-Math.pow((s - 0.5) * 9, 2)); // keep tight through the crossing
    const off = (Math.sin(s * f1 * 6.28 + p1) * 0.6 + Math.sin(s * f2 * 6.28 + p2) * 0.4) * amp * pinch * side;
    pts.push([x + nx * off, y + ny * off]);
  }
  // leaves every ~70px, alternating sides
  const leaves = [];
  let acc = 40 + r() * 30;
  for (let i = 1; i <= N; i++) {
    const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    acc -= d;
    if (acc <= 0) { leaves.push({ i, side: leaves.length % 2 ? 1 : -1, size: 18 + r() * 12, tilt: (r() - 0.5) * 0.6 }); acc = 55 + r() * 40; }
  }
  return { pts, leaves, startDelay, growDur, baseWidth, seed };
}

const STRANDS = [];
let seed = 7;
for (let a = 0; a < 2; a++) {
  STRANDS.push(buildStrand(ARMS[a], seed++, 11, T0 + 0.0 + a * 0.4, 12.5, 7));
  STRANDS.push(buildStrand(ARMS[a], seed++, 15, T0 + 0.9 + a * 0.3, 12.8, 5));
  STRANDS.push(buildStrand(ARMS[a], seed++, 8, T0 + 1.6 + a * 0.5, 12.0, 4));
}

// ---- roses: (strand, position along it, size, bloom start)
const ROSES = [];
{
  const r = mulberry32(99);
  const spots = [
    // bottom-up, so blooms follow the growth. s = position along the strand.
    [0.08, 26], [0.2, 30], [0.33, 28], [0.42, 24], [0.58, 26], [0.7, 30], [0.82, 32], [0.93, 34], [0.99, 36],
  ];
  for (let k = 0; k < STRANDS.length; k++) {
    for (const [s, size] of spots) {
      if (r() < 0.35 && s < 0.9) continue;          // thin out the lower ones
      const i = Math.round(s * N);
      const reach = (STRANDS[k].startDelay + STRANDS[k].growDur * s);
      ROSES.push({ k, i, size: size * (0.85 + r() * 0.3), bloomAt: reach + 1.2 + r() * 1.5, spin: r() * 6.28, rot: (r() - 0.5) * 0.4 });
    }
  }
}

// ---- drawing
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function clipPoly(poly) {
  ctx.beginPath();
  poly.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
  ctx.closePath();
  ctx.clip();
}
const clipShape = () => clipPoly(SHAPE);

function tangent(pts, i) {
  const a = pts[Math.max(0, i - 2)], b = pts[Math.min(pts.length - 1, i + 2)];
  return Math.atan2(b[1] - a[1], b[0] - a[0]);
}

function drawLeaf(x, y, ang, size, g) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.scale(g, g);
  const grad = ctx.createLinearGradient(0, 0, size, 0);
  grad.addColorStop(0, '#1f6b1f');
  grad.addColorStop(1, '#5cc24a');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(size * 0.5, -size * 0.45, size, 0);
  ctx.quadraticCurveTo(size * 0.5, size * 0.45, 0, 0);
  ctx.fill();
  ctx.strokeStyle = 'rgba(20,60,20,0.8)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(size * 0.9, 0); ctx.stroke();
  ctx.restore();
}

function drawStrand(st, t) {
  const p = ease((t - st.startDelay) / st.growDur);
  if (p <= 0) return;
  const n = Math.max(2, Math.floor(p * N));
  const pts = st.pts;
  // stem: dark outer, lighter inner
  for (const [w, col] of [[st.baseWidth + 2, '#143d14'], [st.baseWidth, '#2e7d32'], [Math.max(1, st.baseWidth * 0.4), '#7bd36a']]) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }
  // growing tip curl
  const tip = pts[n - 1], ang = tangent(pts, n - 1);
  ctx.save(); ctx.translate(tip[0], tip[1]); ctx.rotate(ang);
  ctx.strokeStyle = '#8fe07a'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let a = 0; a < 4.5; a += 0.2) { const rr = 10 * (1 - a / 4.5); ctx.lineTo(Math.cos(a) * rr + 4, Math.sin(a) * rr - 2); }
  ctx.stroke();
  ctx.restore();
  // leaves
  for (const lf of st.leaves) {
    if (lf.i >= n) break;
    const g = easeOut((n - lf.i) / 45);
    const q = pts[lf.i], ang = tangent(pts, lf.i);
    drawLeaf(q[0], q[1], ang + lf.side * (0.95 + lf.tilt), lf.size, g);
  }
}

function drawRose(x, y, R, b, spin, rot) {
  if (b <= 0) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  // sepals + bud
  const bud = ease(b / 0.35), open = ease((b - 0.3) / 0.7);
  ctx.fillStyle = '#2e7d32';
  for (let k = 0; k < 5; k++) {
    ctx.save(); ctx.rotate(spin + k * 1.2566);
    ctx.beginPath(); ctx.ellipse(R * 0.35 * bud, 0, R * 0.42 * bud, R * 0.14 * bud, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
  // petals, outer to inner
  const layers = [[7, 1.0, '#7a0f1a', '#c21e2e'], [6, 0.78, '#9c1626', '#e0303f'], [5, 0.56, '#b31d2b', '#ff4a55'], [4, 0.36, '#c92533', '#ff6b70']];
  layers.forEach(([n, f, dark, light], li) => {
    const r = R * f * lerp(0.25, 1, open) * (li === 0 ? 1 : 1);
    for (let k = 0; k < n; k++) {
      const a = spin + k * 6.2832 / n + li * 0.5;
      ctx.save(); ctx.rotate(a);
      const g = ctx.createRadialGradient(r * 0.55, 0, 0, r * 0.55, 0, r * 0.7);
      g.addColorStop(0, light); g.addColorStop(1, dark);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(r * 0.55, 0, r * 0.6, r * 0.42, 0, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = 'rgba(60,0,10,0.6)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
    }
  });
  // heart
  ctx.fillStyle = '#ff8a8a';
  ctx.beginPath(); ctx.arc(0, 0, R * 0.14 * lerp(0.4, 1, open), 0, 6.2832); ctx.fill();
  ctx.restore();
}

// ---- background: night garden on the wall
const FLIES = [];
{
  const r = mulberry32(2024);
  for (let i = 0; i < 70; i++) {
    const gather = i < 50;
    FLIES.push({
      x: 150 + r() * 1450, y: 120 + r() * 850, gather,
      target: ARMS[i % 2][0],                           // a foot of the cross
      f1: 0.2 + r() * 0.4, f2: 0.3 + r() * 0.5, p1: r() * 6.28, p2: r() * 6.28, amp: 40 + r() * 90,
      flick: 2 + r() * 4, fp: r() * 6.28, size: 2 + r() * 2.5, leave: 0.3 + r() * 0.7,
    });
  }
}
const GRASS = [];
{
  const r = mulberry32(55);
  for (let x = 80; x < 1680; x += 9) GRASS.push({ x, base: WALL_BOTTOM(x) + 4, h: 40 + r() * 70, lean: (r() - 0.5) * 0.5, ph: r() * 6.28, w: 2 + r() * 2 });
}
const PETALS = [];
{
  const r = mulberry32(777);
  for (let i = 0; i < 90; i++) {
    const ro = ROSES[Math.floor(r() * ROSES.length)];
    PETALS.push({ ro, release: ro.bloomAt + 2.5 + r() * 9, vx: (r() - 0.5) * 30, fall: 55 + r() * 40, sw: 20 + r() * 40, sf: 0.6 + r() * 0.8, rot: r() * 6.28, rs: (r() - 0.5) * 2, size: 7 + r() * 6, life: 7 + r() * 4 });
  }
}

function drawBackground(t) {
  // night sky to ground
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#02040a');
  g.addColorStop(0.65, '#04101a');
  g.addColorStop(1, '#07200f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // moonlight from the top-left, very soft
  const m = ctx.createRadialGradient(300, -200, 0, 300, -200, 1400);
  m.addColorStop(0, 'rgba(120,150,200,0.10)');
  m.addColorStop(1, 'rgba(120,150,200,0)');
  ctx.fillStyle = m;
  ctx.fillRect(0, 0, W, H);
  // drifting mist
  for (let i = 0; i < 4; i++) {
    const cx = ((t * (18 + i * 7) + i * 530) % (W + 900)) - 450;
    const cy = H * 0.72 + Math.sin(t * 0.3 + i) * 40 + i * 35;
    const mg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 420);
    mg.addColorStop(0, 'rgba(90,120,110,0.09)');
    mg.addColorStop(1, 'rgba(90,120,110,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(0, 0, W, H);
  }
  // grass along the bottom
  ctx.strokeStyle = '#0d3b16';
  ctx.lineCap = 'round';
  for (const b of GRASS) {
    const sway = Math.sin(t * 1.1 + b.ph) * 10;
    ctx.lineWidth = b.w;
    ctx.beginPath();
    ctx.moveTo(b.x, b.base);
    ctx.quadraticCurveTo(b.x + b.lean * 30, b.base - b.h * 0.6, b.x + b.lean * 60 + sway, b.base - b.h);
    ctx.stroke();
  }
}

function drawFireflies(t) {
  for (const f of FLIES) {
    let x = f.x + Math.sin(t * f.f1 + f.p1) * f.amp, y = f.y + Math.sin(t * f.f2 + f.p2) * f.amp * 0.6;
    let alpha = 0.55 + 0.45 * Math.sin(t * f.flick + f.fp);
    if (f.gather) {
      const k = ease((t - 0.8) / 4.6);                 // 0.8 s .. 5.4 s: converge on the feet
      const tx = f.target[0] + Math.sin(t * 3 + f.p1) * 12, ty = f.target[1] - 10 + Math.cos(t * 2.5 + f.p2) * 10;
      x = lerp(x, tx, k); y = lerp(y, ty, k);
      alpha *= 1 - ease((t - T0 - 0.2 - f.leave) / 0.8); // absorbed into the vine
      if (alpha <= 0) continue;
      alpha *= 0.5 + 0.5 * k;                           // brighten as they gather
    } else {
      alpha *= 0.55;
    }
    const rg = ctx.createRadialGradient(x, y, 0, x, y, f.size * 6);
    rg.addColorStop(0, `rgba(220,255,140,${0.9 * alpha})`);
    rg.addColorStop(0.25, `rgba(180,240,90,${0.35 * alpha})`);
    rg.addColorStop(1, 'rgba(180,240,90,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(x - f.size * 6, y - f.size * 6, f.size * 12, f.size * 12);
  }
}

function drawPulse(t) {
  // when the vines meet at the centre, a ring of light rolls across the wall
  const tm = T0 + 6.3;
  const k = (t - tm) / 3.5;
  if (k <= 0 || k >= 1) return;
  const rad = k * 1500;
  const rg = ctx.createRadialGradient(CENTER[0], CENTER[1], Math.max(0, rad - 140), CENTER[0], CENTER[1], rad);
  rg.addColorStop(0, 'rgba(170,255,170,0)');
  rg.addColorStop(0.7, `rgba(170,255,170,${0.22 * (1 - k)})`);
  rg.addColorStop(1, 'rgba(170,255,170,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);
}

function drawRoseGlow(t) {
  // warm light spilling onto the wall as the roses open
  const k = ease((t - (T0 + 7)) / 8);
  if (k <= 0) return;
  for (const c of [[800, 300], [1040, 300], [918, 538], [790, 900], [1050, 900]]) {
    const rg = ctx.createRadialGradient(c[0], c[1], 0, c[0], c[1], 380);
    rg.addColorStop(0, `rgba(255,60,80,${0.16 * k})`);
    rg.addColorStop(1, 'rgba(255,60,80,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawPetals(t) {
  for (const p of PETALS) {
    const age = t - p.release;
    if (age <= 0 || age > p.life) continue;
    const q = STRANDS[p.ro.k].pts[p.ro.i];
    const x = q[0] + p.vx * age + Math.sin(age * p.sf + p.rot) * p.sw;
    const y = q[1] + p.fall * age + 20 * age * age;
    if (y > H + 20) continue;
    const alpha = Math.min(1, age * 2) * (1 - ease((age - p.life + 2) / 2));
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(p.rot + age * p.rs);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#d0263a';
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }
}

function renderAt(t) {
  t = ((t % DURATION) + DURATION) % DURATION;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  if (!NOBG) {
    ctx.save();
    clipPoly(WALL);
    drawBackground(t);
    drawPulse(t);
    drawRoseGlow(t);
    drawFireflies(t);
    ctx.restore();
  }
  ctx.save();
  clipShape();
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  // faint wood warmth so the cross reads before the vines arrive
  ctx.fillStyle = 'rgba(40, 24, 10, 0.5)';
  ctx.fillRect(0, 0, W, H);
  for (const st of STRANDS) drawStrand(st, t);
  for (const ro of ROSES) {
    const st = STRANDS[ro.k];
    const p = ease((t - st.startDelay) / st.growDur);
    if (Math.floor(p * N) <= ro.i) continue;
    const q = st.pts[ro.i];
    const sway = Math.sin(t * 1.3 + ro.spin) * 0.03;
    drawRose(q[0], q[1], ro.size, ease((t - ro.bloomAt) / 2.2), ro.spin + sway, ro.rot);
  }
  ctx.restore();
  if (!NOBG) { ctx.save(); clipPoly(WALL); drawPetals(t); ctx.restore(); }
  // fade out at the end so the loop restarts cleanly
  const fade = ease((t - (DURATION - 2)) / 2);
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
window.renderAt = renderAt;
window.DURATION = DURATION;
window.FPS = FPS;

// ---- live preview + WebM recorder (for use straight in a browser)
const params = new URLSearchParams(location.search);
if (!params.has('frame')) {
  let playing = true, t0 = performance.now(), tAt = 0;
  const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
  function loop() {
    if (playing) tAt = ((performance.now() - t0) / 1000) % DURATION;
    renderAt(tAt);
    scrub.value = tAt / DURATION;
    timeEl.textContent = tAt.toFixed(1) + ' s';
    requestAnimationFrame(loop);
  }
  document.getElementById('play').onclick = e => { playing = !playing; if (playing) t0 = performance.now() - tAt * 1000; e.target.textContent = playing ? 'Pause' : 'Play'; };
  scrub.oninput = () => { playing = false; document.getElementById('play').textContent = 'Play'; tAt = scrub.value * DURATION; };
  document.getElementById('rec').onclick = async () => {
    const status = document.getElementById('status');
    const stream = canvas.captureStream(FPS);
    const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 12e6 });
    const chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      a.download = (NOBG ? 'cross_vines_roses' : 'wall_cross_vines_roses') + '_1920x1080.webm';
      a.click();
      status.textContent = 'Saved vines_roses_1920x1080.webm';
    };
    playing = true; t0 = performance.now(); tAt = 0;
    rec.start();
    status.textContent = 'Recording one loop…';
    setTimeout(() => rec.stop(), DURATION * 1000);
  };
  loop();
}
</script>
</body>
