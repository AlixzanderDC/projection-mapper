</head>

const WALL = '94.5,1.5;126.9,1.5;159.4,1.5;191.9,1.5;224.4,1.5;256.9,1.5;289.5,1.5;322.1,1.5;354.6,1.5;387.2,1.5;419.9,1.5;452.5,1.5;485.2,1.5;517.9,1.5;550.6,1.5;583.3,1.5;616.1,1.5;648.8,1.5;681.6,1.5;714.4,1.5;747.3,1.5;780.1,1.5;813.0,1.5;845.9,1.5;878.8,1.5;911.7,1.5;944.7,1.5;977.6,1.5;1010.6,1.5;1043.6,1.5;1076.7,1.5;1109.7,1.5;1142.8,1.5;1175.9,1.5;1209.0,1.5;1242.1,1.5;1275.3,1.5;1308.4,1.5;1341.6,1.5;1374.8,1.5;1408.1,1.5;1441.3,1.5;1474.6,1.5;1507.9,1.5;1541.2,1.5;1574.5,1.5;1607.9,1.5;1641.3,1.5;1674.7,1.5;1674.3,23.7;1674.0,45.9;1673.7,68.1;1673.4,90.2;1673.1,112.4;1672.8,134.6;1672.4,156.7;1672.1,178.8;1671.8,201.0;1671.5,223.1;1671.2,245.2;1670.8,267.3;1670.5,289.4;1670.2,311.5;1669.9,333.6;1669.6,355.7;1669.2,377.8;1668.9,399.9;1668.6,421.9;1668.3,444.0;1668.0,466.0;1667.7,488.1;1667.3,510.1;1667.0,532.1;1666.7,554.1;1666.4,576.2;1666.1,598.2;1665.8,620.2;1665.4,642.1;1665.1,664.1;1664.8,686.1;1664.5,708.1;1664.2,730.0;1663.8,752.0;1663.5,774.0;1663.2,795.9;1662.9,817.8;1662.6,839.8;1662.3,861.7;1662.0,883.6;1661.6,905.5;1661.3,927.4;1661.0,949.3;1660.7,971.2;1660.4,993.0;1660.1,1014.9;1659.7,1036.8;1659.4,1058.6;1626.3,1058.3;1593.2,1058.0;1560.1,1057.7;1527.0,1057.4;1494.0,1057.0;1460.9,1056.7;1427.9,1056.4;1394.9,1056.1;1361.9,1055.8;1329.0,1055.4;1296.0,1055.1;1263.1,1054.8;1230.2,1054.5;1197.4,1054.2;1164.5,1053.8;1131.7,1053.5;1098.9,1053.2;1066.1,1052.9;1033.3,1052.5;1000.5,1052.2;967.8,1051.9;935.1,1051.6;902.4,1051.3;869.7,1051.0;837.1,1050.6;804.4,1050.3;771.8,1050.0;739.2,1049.7;706.6,1049.4;674.1,1049.1;641.6,1048.7;609.0,1048.4;576.5,1048.1;544.1,1047.8;511.6,1047.5;479.2,1047.2;446.8,1046.8;414.4,1046.5;382.0,1046.2;349.6,1045.9;317.3,1045.6;284.9,1045.3;252.7,1045.0;220.4,1044.6;188.1,1044.3;155.9,1044.0;123.6,1043.7;91.4,1043.4;91.5,1021.9;91.5,1000.3;91.6,978.7;91.7,957.2;91.7,935.6;91.8,914.0;91.9,892.4;91.9,870.8;92.0,849.2;92.1,827.6;92.1,806.0;92.2,784.4;92.2,762.8;92.3,741.1;92.4,719.5;92.4,697.9;92.5,676.2;92.6,654.5;92.6,632.9;92.7,611.2;92.8,589.5;92.8,567.8;92.9,546.1;93.0,524.4;93.0,502.7;93.1,481.0;93.1,459.3;93.2,437.6;93.3,415.8;93.3,394.1;93.4,372.3;93.5,350.6;93.5,328.8;93.6,307.0;93.7,285.3;93.7,263.5;93.8,241.7;93.8,219.9;93.9,198.1;94.0,176.3;94.0,154.4;94.1,132.6;94.2,110.8;94.2,89.0;94.3,67.1;94.3,45.2;94.4,23.4'.split(';').map(p => p.split(',').map(Number));
const CENTER = [918, 538];
const WALL_C = [883, 530];
const LOGO_URL = PARAMS.get('logo') || '../media/crucible-logo.png';

// timeline (seconds), from the music's loudness curve
const T_FADE = 0.7, T_BLUE = 2.4, T_ARC0 = 2.0, T_ARC1 = 6.2, T_LOGO0 = 5.8, T_HIT = 8.55, T_DECAY = 12.3, T_END = 13.6;

const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const easeOut = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function clipPoly(poly) { ctx.beginPath(); poly.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); ctx.clip(); }
function pathPoly(poly) { ctx.beginPath(); poly.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); }

// ---- logo: key the black background to transparency once
let logo = null, logoGlow = null, logoReady = false;
const logoImg = new Image();
logoImg.onload = () => {
  const c = document.createElement('canvas'); c.width = logoImg.width; c.height = logoImg.height;
  const g = c.getContext('2d'); g.drawImage(logoImg, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height);
  for (let i = 0; i < d.data.length; i += 4) {
    const l = Math.max(d.data[i], d.data[i + 1], d.data[i + 2]);
    d.data[i + 3] = Math.min(255, l * 1.4);
    if (l > 0) { const k = 255 / l; d.data[i] = Math.min(255, d.data[i] * k); d.data[i + 1] = Math.min(255, d.data[i + 1] * k); d.data[i + 2] = Math.min(255, d.data[i + 2] * k); }
  }
  g.putImageData(d, 0, 0);
  logo = c;
  const gc = document.createElement('canvas'); gc.width = c.width; gc.height = c.height;
  const gg = gc.getContext('2d'); gg.filter = 'blur(28px)'; gg.drawImage(c, 0, 0); gg.filter = 'blur(10px)'; gg.globalCompositeOperation = 'lighter'; gg.drawImage(c, 0, 0);
  logoGlow = gc;
  logoReady = true;
};
logoImg.onerror = () => { document.getElementById('status').textContent = 'logo failed to load: ' + LOGO_URL; };
logoImg.src = LOGO_URL;
const LOGO_W = 1260, LOGO_CX = WALL_C[0], LOGO_CY = 520;

// ---- stars and sparkles
const STARS = []; { const r = mulberry32(3); for (let i = 0; i < 140; i++) STARS.push({ x: 100 + r() * 1480, y: 20 + r() * 900, s: 0.5 + r() * 1.4, ph: r() * 6.28, f: 0.6 + r() * 1.6 }); }
const SPARKS = []; { const r = mulberry32(44); for (let i = 0; i < 160; i++) SPARKS.push({ s: r(), dy: (r() - 0.5) * 80, dx: (r() - 0.5) * 40, life: 0.6 + r() * 1.2, size: 1 + r() * 2.5, ph: r() * 6.28 }); }
const EMBERS = []; { const r = mulberry32(99); for (let i = 0; i < 120; i++) EMBERS.push({ x: 150 + r() * 1450, y: 200 + r() * 800, vx: (r() - 0.5) * 20, vy: -15 - r() * 30, ph: r() * 6.28, f: 1 + r() * 3, size: 1 + r() * 2 }); }

// arc over the top of the cross, left to right
const arcPos = s => [lerp(110, 1660, s), 470 - 390 * Math.sin(Math.PI * s)];
const arcS = t => (t - T_ARC0) / (T_ARC1 - T_ARC0);

function drawWall(t) {
  const blue = ease((t - T_FADE) / (T_BLUE - T_FADE));
  const hit = ease((t - T_HIT) / 0.5);
  // classic deep-blue field, lighter toward the bottom
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `rgba(4,8,46,${blue})`);
  g.addColorStop(0.55, `rgba(12,34,120,${blue})`);
  g.addColorStop(1, `rgba(26,68,180,${blue})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // glow behind the centre, grows with the finale
  const cg = ctx.createRadialGradient(WALL_C[0], WALL_C[1], 0, WALL_C[0], WALL_C[1], 900);
  cg.addColorStop(0, `rgba(80,110,220,${0.25 * blue + 0.2 * hit})`);
  cg.addColorStop(1, 'rgba(80,110,220,0)');
  ctx.fillStyle = cg; ctx.fillRect(0, 0, W, H);
  // stars
  for (const s of STARS) {
    const a = blue * (0.35 + 0.65 * Math.max(0, Math.sin(t * s.f + s.ph))) * 0.8;
    if (a < 0.03) continue;
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 6.2832); ctx.fill();
  }
  // embers drifting up before the logo arrives, golden
  const emberA = ease((t - T_FADE) / 2) * (1 - ease((t - T_HIT) / 1.5));
  if (emberA > 0.01) {
    for (const e of EMBERS) {
      const age = t - T_FADE;
      const x = e.x + e.vx * age + Math.sin(age * e.f + e.ph) * 12, y = ((e.y + e.vy * age) % 1100 + 1100) % 1100;
      const a = emberA * (0.4 + 0.6 * Math.abs(Math.sin(age * e.f * 1.7 + e.ph)));
      const rg = ctx.createRadialGradient(x, y, 0, x, y, e.size * 5);
      rg.addColorStop(0, `rgba(255,210,120,${0.9 * a})`); rg.addColorStop(0.3, `rgba(255,160,60,${0.4 * a})`); rg.addColorStop(1, 'rgba(255,160,60,0)');
      ctx.fillStyle = rg; ctx.fillRect(x - e.size * 5, y - e.size * 5, e.size * 10, e.size * 10);
    }
  }
  // the logo, rising out of the dark
  if (logoReady) {
    const emerge = ease((t - T_LOGO0) / (T_HIT - T_LOGO0));
    const full = ease((t - T_HIT) / 0.6);
    const decay = 1 - 0.25 * ease((t - T_DECAY) / 1.5);
    const alpha = (0.45 * emerge + 0.55 * full) * decay;
    if (alpha > 0.005) {
      const scale = lerp(0.9, 1, easeOut(emerge)) * (1 + 0.04 * full * Math.exp(-(t - T_HIT) * 2));
      const w = LOGO_W * scale, h = w * logo.height / logo.width;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = alpha * (0.5 + 0.6 * full);
      ctx.drawImage(logoGlow, LOGO_CX - w * 0.55, LOGO_CY - h * 0.55, w * 1.1, h * 1.1);
      ctx.globalAlpha = alpha;
      ctx.drawImage(logo, LOGO_CX - w / 2, LOGO_CY - h / 2, w, h);
      ctx.restore();
    }
  }
  // finale flare + rays from the logo
  const flare = Math.max(0, 1 - (t - T_HIT) / 1.4);
  if (t > T_HIT && flare > 0) {
    const fg = ctx.createRadialGradient(WALL_C[0], LOGO_CY, 0, WALL_C[0], LOGO_CY, 1200);
    fg.addColorStop(0, `rgba(255,230,160,${0.55 * flare})`); fg.addColorStop(0.3, `rgba(255,190,90,${0.25 * flare})`); fg.addColorStop(1, 'rgba(255,190,90,0)');
    ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
  }
  const rays = ease((t - T_HIT) / 1.2) * (1 - 0.6 * ease((t - T_DECAY) / 1.5));
  if (rays > 0.01) {
    ctx.save(); ctx.translate(WALL_C[0], LOGO_CY); ctx.rotate(t * 0.05);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 18; i++) {
      const a = i * 6.2832 / 18, wdt = 0.05 + 0.03 * Math.sin(i * 1.7 + t * 0.4);
      const rg = ctx.createLinearGradient(0, 0, Math.cos(a) * 1300, Math.sin(a) * 1300);
      rg.addColorStop(0, `rgba(255,215,130,${0.10 * rays})`); rg.addColorStop(1, 'rgba(255,215,130,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a - wdt) * 1300, Math.sin(a - wdt) * 1300); ctx.lineTo(Math.cos(a + wdt) * 1300, Math.sin(a + wdt) * 1300); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  // the sweeping light and its glittering trail
  const s = arcS(t);
  if (s > -0.05 && s < 1.25) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 40; k++) {
      const ss = s - k * 0.012; if (ss < 0 || ss > 1) continue;
      const [x, y] = arcPos(ss); const a = (1 - k / 40) * 0.9;
      const rg = ctx.createRadialGradient(x, y, 0, x, y, 26 - k * 0.4);
      rg.addColorStop(0, `rgba(255,255,240,${a})`); rg.addColorStop(0.4, `rgba(255,225,150,${0.5 * a})`); rg.addColorStop(1, 'rgba(255,225,150,0)');
      ctx.fillStyle = rg; ctx.fillRect(x - 30, y - 30, 60, 60);
    }
    for (const sp of SPARKS) {
      const born = T_ARC0 + sp.s * (T_ARC1 - T_ARC0); const age = t - born;
      if (age < 0 || age > sp.life) continue;
      const [x0, y0] = arcPos(sp.s); const x = x0 + sp.dx * age * 2, y = y0 + sp.dy * age + 60 * age * age;
      const a = (1 - age / sp.life) * (0.6 + 0.4 * Math.sin(t * 25 + sp.ph));
      ctx.fillStyle = `rgba(255,240,200,${a})`; ctx.beginPath(); ctx.arc(x, y, sp.size, 0, 6.2832); ctx.fill();
    }
    if (s >= 0 && s <= 1) { const [x, y] = arcPos(s); const hg = ctx.createRadialGradient(x, y, 0, x, y, 140); hg.addColorStop(0, 'rgba(255,255,255,0.9)'); hg.addColorStop(0.15, 'rgba(255,240,190,0.5)'); hg.addColorStop(1, 'rgba(255,220,150,0)'); ctx.fillStyle = hg; ctx.fillRect(x - 140, y - 140, 280, 280); }
    ctx.restore();
  }
  // vignette
  const vg = ctx.createRadialGradient(WALL_C[0], 540, 400, WALL_C[0], 540, 1150);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function drawCross(t) {
  const blue = ease((t - T_FADE) / (T_BLUE - T_FADE));
  // dark wood until the light arrives
  ctx.fillStyle = `rgb(${Math.round(14 * blue)},${Math.round(16 * blue)},${Math.round(30 * blue)})`;
  ctx.fillRect(0, 0, W, H);
  // reveal: lit left of the sweeping light, in white-gold, warming to gold
  const s = arcS(t);
  const litX = s < 0 ? -500 : s > 1 ? 3000 : arcPos(s)[0];
  const hit = ease((t - T_HIT) / 0.5);
  const decay = 1 - 0.2 * ease((t - T_DECAY) / 1.5);
  const warm = ease((t - T_ARC1) / 2.5);
  const g = ctx.createLinearGradient(litX - 140, 0, litX + 40, 0);
  const core = `rgba(${Math.round(lerp(255, 255, warm))},${Math.round(lerp(248, 214, warm))},${Math.round(lerp(225, 120, warm))},`;
  g.addColorStop(0, core + (0.95 * decay) + ')');
  g.addColorStop(1, core + '0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // depth: darker toward the arm edges, bright along the centre line (the "light inside")
  ctx.save(); ctx.globalCompositeOperation = 'multiply';
  ctx.lineWidth = 24; ctx.strokeStyle = 'rgba(120,80,30,0.55)'; pathPoly(CROSS); ctx.stroke();
  ctx.restore();
  // shimmer bands drifting along the arms once lit, plus the finale pulse
  const lit = s > 1 ? 1 : 0;
  if (lit) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 6; i++) {
      const p = ((t * 0.18 + i / 6) % 1); const y = p * H;
      const sg = ctx.createLinearGradient(0, y - 90, 0, y + 90);
      sg.addColorStop(0, 'rgba(255,240,200,0)'); sg.addColorStop(0.5, `rgba(255,240,200,${0.18 + 0.25 * hit * Math.exp(-(t - T_HIT) * 0.8)})`); sg.addColorStop(1, 'rgba(255,240,200,0)');
      ctx.fillStyle = sg; ctx.fillRect(0, y - 90, W, 180);
    }
    const pulse = hit * Math.exp(-(t - T_HIT) * 1.5);
    if (pulse > 0.01) { ctx.fillStyle = `rgba(255,250,230,${0.6 * pulse})`; ctx.fillRect(0, 0, W, H); }
    ctx.restore();
  }
  // sparkle at the crossing point during the finale
  const sp = ease((t - T_HIT) / 0.3) * (1 - 0.5 * ease((t - T_DECAY) / 1.5));
  if (sp > 0.01) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(CENTER[0], CENTER[1]); ctx.rotate(t * 0.6);
    for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 4); const lg = ctx.createLinearGradient(-220, 0, 220, 0); lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, `rgba(255,255,240,${0.8 * sp})`); lg.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = lg; ctx.fillRect(-220, -3, 440, 6); }
    ctx.restore();
  }
}

function renderAt(t) {
  t = Math.max(0, Math.min(DURATION, t));
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save(); clipPoly(WALL); drawWall(t); ctx.restore();
  ctx.save(); clipPoly(CROSS); drawCross(t); ctx.restore();
  const fade = ease((t - T_END) / (DURATION - T_END - 0.05));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
window.renderAt = renderAt; window.DURATION = DURATION; window.FPS = FPS;
window.assetsReady = () => logoReady;

if (!PARAMS.has('frame')) {
  let playing = true, t0 = performance.now(), tAt = 0;
  const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
  const audio = new Audio('../media/disney-logo-theme.mp3');
  function loop() {
    if (playing) tAt = ((performance.now() - t0) / 1000) % DURATION;
    renderAt(tAt); scrub.value = tAt / DURATION; timeEl.textContent = tAt.toFixed(1) + ' s';
    if (playing && audio.paused && tAt < 0.2) audio.play().catch(() => {});
    requestAnimationFrame(loop);
  }
  document.getElementById('play').onclick = e => { playing = !playing; if (playing) { t0 = performance.now() - tAt * 1000; audio.currentTime = tAt; audio.play().catch(() => {}); } else audio.pause(); e.target.textContent = playing ? 'Pause' : 'Play'; };
  scrub.oninput = () => { playing = false; audio.pause(); document.getElementById('play').textContent = 'Play'; tAt = scrub.value * DURATION; };
  loop();
}
</script>
</body>
</html>
