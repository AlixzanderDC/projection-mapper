function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const easeOut = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
const lerp = (a, b, t) => a + (b - a) * t;

// ---- build strands (polylines along the arms with seeded wiggle)
const N = 420;
function buildStrand(arm, seed, amp, startDelay, growDur, baseWidth) {
  const r = mulberry32(seed);
  const f1 = 2 + r() * 2, f2 = 5 + r() * 4, p1 = r() * 6.28, p2 = r() * 6.28, side = r() < 0.5 ? -1 : 1;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const s = i / N;
    const seg = s < 0.5 ? 0 : 1, ls = (s - seg * 0.5) * 2;
    const a = arm[seg], b = arm[seg + 1];
    const x = lerp(a[0], b[0], ls), y = lerp(a[1], b[1], ls);
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    const nx = -dy / L, ny = dx / L;
    const pinch = 1 - 0.7 * Math.exp(-Math.pow((s - 0.5) * 9, 2)); // keep tight through the crossing
    const off = (Math.sin(s * f1 * 6.28 + p1) * 0.6 + Math.sin(s * f2 * 6.28 + p2) * 0.4) * amp * pinch * side;
    pts.push([x + nx * off, y + ny * off]);
  }
  // leaves every ~70px, alternating sides
  const leaves = [];
  let acc = 40 + r() * 30;
  for (let i = 1; i <= N; i++) {
    const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    acc -= d;
    if (acc <= 0) { leaves.push({ i, side: leaves.length % 2 ? 1 : -1, size: 18 + r() * 12, tilt: (r() - 0.5) * 0.6 }); acc = 55 + r() * 40; }
  }
  return { pts, leaves, startDelay, growDur, baseWidth, seed };
}

}

}

// ---- drawing
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function clipPoly(poly) {
  ctx.beginPath();
  poly.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
  ctx.closePath();
  ctx.clip();
}
const clipShape = () => clipPoly(SHAPE);

function tangent(pts, i) {
  const a = pts[Math.max(0, i - 2)], b = pts[Math.min(pts.length - 1, i + 2)];
  return Math.atan2(b[1] - a[1], b[0] - a[0]);
}

function drawLeaf(x, y, ang, size, g) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.scale(g, g);
  const grad = ctx.createLinearGradient(0, 0, size, 0);
  grad.addColorStop(0, '#1f6b1f');
  grad.addColorStop(1, '#5cc24a');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(size * 0.5, -size * 0.45, size, 0);
  ctx.quadraticCurveTo(size * 0.5, size * 0.45, 0, 0);
  ctx.fill();
  ctx.strokeStyle = 'rgba(20,60,20,0.8)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(size * 0.9, 0); ctx.stroke();
  ctx.restore();
}

function drawStrand(st, t) {
  const p = ease((t - st.startDelay) / st.growDur);
  if (p <= 0) return;
  const n = Math.max(2, Math.floor(p * N));
  const pts = st.pts;
  // stem: dark outer, lighter inner
  for (const [w, col] of [[st.baseWidth + 2, '#143d14'], [st.baseWidth, '#2e7d32'], [Math.max(1, st.baseWidth * 0.4), '#7bd36a']]) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < n; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }
  // growing tip curl
  const tip = pts[n - 1], ang = tangent(pts, n - 1);
  ctx.save(); ctx.translate(tip[0], tip[1]); ctx.rotate(ang);
  ctx.strokeStyle = '#8fe07a'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let a = 0; a < 4.5; a += 0.2) { const rr = 10 * (1 - a / 4.5); ctx.lineTo(Math.cos(a) * rr + 4, Math.sin(a) * rr - 2); }
  ctx.stroke();
  ctx.restore();
  // leaves
  for (const lf of st.leaves) {
    if (lf.i >= n) break;
    const g = easeOut((n - lf.i) / 45);
    const q = pts[lf.i], ang = tangent(pts, lf.i);
    drawLeaf(q[0], q[1], ang + lf.side * (0.95 + lf.tilt), lf.size, g);
  }
}

function drawRose(x, y, R, b, spin, rot) {
  if (b <= 0) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  // sepals + bud
  const bud = ease(b / 0.35), open = ease((b - 0.3) / 0.7);
  ctx.fillStyle = '#2e7d32';
  for (let k = 0; k < 5; k++) {
    ctx.save(); ctx.rotate(spin + k * 1.2566);
    ctx.beginPath(); ctx.ellipse(R * 0.35 * bud, 0, R * 0.42 * bud, R * 0.14 * bud, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
  // petals, outer to inner
  const layers = [[7, 1.0, '#7a0f1a', '#c21e2e'], [6, 0.78, '#9c1626', '#e0303f'], [5, 0.56, '#b31d2b', '#ff4a55'], [4, 0.36, '#c92533', '#ff6b70']];
  layers.forEach(([n, f, dark, light], li) => {
    const r = R * f * lerp(0.25, 1, open) * (li === 0 ? 1 : 1);
    for (let k = 0; k < n; k++) {
      const a = spin + k * 6.2832 / n + li * 0.5;
      ctx.save(); ctx.rotate(a);
      const g = ctx.createRadialGradient(r * 0.55, 0, 0, r * 0.55, 0, r * 0.7);
      g.addColorStop(0, light); g.addColorStop(1, dark);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(r * 0.55, 0, r * 0.6, r * 0.42, 0, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = 'rgba(60,0,10,0.6)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
    }
  });
  // heart
  ctx.fillStyle = '#ff8a8a';
  ctx.beginPath(); ctx.arc(0, 0, R * 0.14 * lerp(0.4, 1, open), 0, 6.2832); ctx.fill();
  ctx.restore();
}

}

function drawSky(t) {
  const n = night(t);
  const g = ctx.createLinearGradient(0, 0, 0, HORIZON + 40);
  g.addColorStop(0, mixc([28, 14, 56], [3, 6, 18], n));

  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, HORIZON + 40);
  // setting sun behind the cross
  const sunY = HORIZON - 10 + n * 90;
  const sg = ctx.createRadialGradient(CENTER[0], sunY, 0, CENTER[0], sunY, 520);
  sg.addColorStop(0, `rgba(255,190,90,${0.75 * (1 - n)})`);

  for (const s of STARS) {
    const a = n * (0.5 + 0.5 * Math.sin(t * s.f + s.ph)) * 0.9;
    if (a <= 0.02) continue;
    ctx.fillStyle = `rgba(255,255,240,${a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 6.2832); ctx.fill();
  }
}

function drawHills(t) {
  const n = night(t);
  HILLS.forEach((pts, i) => {
    ctx.fillStyle = mixc([70 - i * 15, 30 - i * 6, 60 - i * 12], [10 - i * 2, 12 - i * 2, 28 - i * 5], n);
    ctx.beginPath();
    ctx.moveTo(0, HORIZON + 60);
    pts.forEach(p => ctx.lineTo(p[0], p[1]));
    ctx.lineTo(W, HORIZON + 60);
    ctx.closePath();
    ctx.fill();
  });
}

function drawGround(t) {
  const n = night(t);
  const g = ctx.createLinearGradient(0, HORIZON - 30, 0, H);
  g.addColorStop(0, mixc([40, 44, 22], [8, 16, 12], n));
  g.addColorStop(1, mixc([14, 24, 10], [3, 8, 6], n));
  ctx.fillStyle = g;
  ctx.fillRect(0, HORIZON - 30, W, H - HORIZON + 30);
  // path to the cross
  ctx.fillStyle = mixc([84, 66, 40], [30, 26, 22], n);
  ctx.beginPath();
  ctx.moveTo(CENTER[0] - 60, HORIZON + 10); ctx.lineTo(CENTER[0] + 60, HORIZON + 10);
  ctx.lineTo(CENTER[0] + 330, H); ctx.lineTo(CENTER[0] - 330, H);
  ctx.closePath(); ctx.fill();
  // bushes and undergrowth
  for (const b of BUSHES) {
    ctx.fillStyle = mixc([24 + b.g * 20, 60 + b.g * 30, 22], [5 + b.g * 6, 16 + b.g * 10, 8], n);
    ctx.beginPath(); ctx.ellipse(b.x, b.y, b.rx, b.ry, 0, 0, 6.2832); ctx.fill();
  }
}

function drawTrees(t) {
  const n = night(t);
  const col = mixc([18, 12, 22], [3, 4, 8], n);
  for (const tr of TREES) {
    ctx.fillStyle = col;
    ctx.fillRect(tr.x - tr.trunk / 2, tr.base - tr.h * 0.55, tr.trunk, tr.h * 0.6);
    for (const [dx, dy, r] of tr.blobs) { ctx.beginPath(); ctx.arc(tr.x + dx, tr.base + dy, r, 0, 6.2832); ctx.fill(); }
  }
}

function drawRuins(t) {
  const n = night(t);
  const stone = mixc([70, 66, 74], [26, 26, 34], n), dark = mixc([40, 36, 44], [12, 12, 18], n);
  // left: broken arch
  ctx.fillStyle = stone;
  ctx.fillRect(60, 300, 60, 420);
  ctx.fillRect(200, 360, 50, 360);
  ctx.beginPath(); ctx.arc(155, 330, 95, Math.PI, 2 * Math.PI); ctx.lineTo(250, 330); ctx.arc(155, 330, 35, 0, Math.PI, true); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = dark; ctx.lineWidth = 2;
  for (let y = 320; y < 720; y += 42) { ctx.beginPath(); ctx.moveTo(60, y); ctx.lineTo(120, y); ctx.moveTo(200, y + 20); ctx.lineTo(250, y + 20); ctx.stroke(); }
  // right: column stump and wall
  ctx.fillStyle = stone;
  ctx.fillRect(1480, 380, 70, 340);
  ctx.fillRect(1600, 470, 60, 250);
  for (let y = 400; y < 720; y += 44) { ctx.beginPath(); ctx.moveTo(1480, y); ctx.lineTo(1550, y); ctx.moveTo(1600, y + 18); ctx.lineTo(1660, y + 18); ctx.stroke(); }
}

function drawLanterns(t) {
  LANTERNS.forEach(([x, y], i) => {
    const flick = 0.85 + 0.15 * Math.sin(t * 9 + i * 2) * Math.sin(t * 13.7 + i);
    const n = night(t), k = (0.35 + 0.65 * n) * flick;     // lanterns matter more as it gets dark
    // post + box
    ctx.fillStyle = '#0a0806';
    ctx.fillRect(x - 4, y, 8, 300);
    ctx.fillRect(x - 16, y - 34, 32, 40);
    // glass
    ctx.fillStyle = `rgba(255,190,80,${0.9 * flick})`;
    ctx.fillRect(x - 11, y - 29, 22, 30);
    // glow on the scene
    const g = ctx.createRadialGradient(x, y - 14, 0, x, y - 14, 330);
    g.addColorStop(0, `rgba(255,170,60,${0.55 * k})`);
    g.addColorStop(0.3, `rgba(255,130,40,${0.18 * k})`);
    g.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 330, y - 344, 660, 660);
  });
}

const BOLT = [];
{
  const r = mulberry32(404);
  let x = CENTER[0] + 30, y = 40;
  BOLT.push([x, y]);
  while (y < HORIZON - 20) { y += 18 + r() * 26; x += (r() - 0.5) * 60; BOLT.push([x, y]); }
}
function lightningFlash(t) {
  let f = 0;
  for (const k of [TL, TL + 0.12, TL + 0.45]) if (t > k) f = Math.max(f, Math.exp(-(t - k) * 11));
  return f;
}
function drawLightning(t) {
  const f = lightningFlash(t);
  if (f <= 0.01) return;
  ctx.fillStyle = `rgba(150,110,255,${0.35 * f})`;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.shadowColor = '#d0a8ff'; ctx.shadowBlur = 40;
  ctx.strokeStyle = `rgba(230,210,255,${f})`;
  ctx.lineWidth = 4;
  ctx.beginPath(); BOLT.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.strokeStyle = `rgba(200,170,255,${0.8 * f})`;
  ctx.beginPath(); ctx.moveTo(BOLT[5][0], BOLT[5][1]); ctx.lineTo(BOLT[5][0] - 90, BOLT[5][1] + 120); ctx.lineTo(BOLT[5][0] - 120, BOLT[5][1] + 200);
  ctx.moveTo(BOLT[9][0], BOLT[9][1]); ctx.lineTo(BOLT[9][0] + 70, BOLT[9][1] + 90); ctx.stroke();
  ctx.restore();
}

function drawVignette() {
  const g = ctx.createRadialGradient(CENTER[0], 540, 300, CENTER[0], 540, 1150);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

const FLIES = [];
{
  const r = mulberry32(2024);
  for (let i = 0; i < 26; i++) FLIES.push({ x: 150 + r() * 1450, y: 300 + r() * 650, f1: 0.2 + r() * 0.4, f2: 0.3 + r() * 0.5, p1: r() * 6.28, p2: r() * 6.28, amp: 40 + r() * 90, flick: 2 + r() * 4, fp: r() * 6.28, size: 2 + r() * 2 });
}
function drawFireflies(t) {
  const n = night(t);
  for (const f of FLIES) {
    const x = f.x + Math.sin(t * f.f1 + f.p1) * f.amp, y = f.y + Math.sin(t * f.f2 + f.p2) * f.amp * 0.6;
    const alpha = (0.55 + 0.45 * Math.sin(t * f.flick + f.fp)) * 0.6 * n;
    if (alpha <= 0.02) continue;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, f.size * 6);
    rg.addColorStop(0, `rgba(220,255,140,${0.9 * alpha})`);
    rg.addColorStop(0.25, `rgba(180,240,90,${0.35 * alpha})`);
    rg.addColorStop(1, 'rgba(180,240,90,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(x - f.size * 6, y - f.size * 6, f.size * 12, f.size * 12);
  }
}

const PETALS = [];
{
  const r = mulberry32(777);
  for (let i = 0; i < 90; i++) {
    const ro = ROSES[Math.floor(r() * ROSES.length)];
    PETALS.push({ ro, release: ro.bloomAt + 2.5 + r() * 9, vx: (r() - 0.5) * 30, fall: 55 + r() * 40, sw: 20 + r() * 40, sf: 0.6 + r() * 0.8, rot: r() * 6.28, rs: (r() - 0.5) * 2, size: 7 + r() * 6, life: 7 + r() * 4 });
  }
}

function drawPulse(t) {
  const tm = T0 + 6.3;
  const k = (t - tm) / 3.5;
  if (k <= 0 || k >= 1) return;
  const rad = k * 1500;
  const rg = ctx.createRadialGradient(CENTER[0], CENTER[1], Math.max(0, rad - 140), CENTER[0], CENTER[1], rad);
  rg.addColorStop(0, 'rgba(170,255,170,0)');
  rg.addColorStop(0.7, `rgba(170,255,170,${0.18 * (1 - k)})`);
  rg.addColorStop(1, 'rgba(170,255,170,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);
}

function drawRoseGlow(t) {
  const k = ease((t - (T0 + 7)) / 8);
  if (k <= 0) return;
  for (const c of [[800, 300], [1040, 300], [918, 538], [790, 900], [1050, 900]]) {
    const rg = ctx.createRadialGradient(c[0], c[1], 0, c[0], c[1], 380);
    rg.addColorStop(0, `rgba(255,60,80,${0.14 * k})`);
    rg.addColorStop(1, 'rgba(255,60,80,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawPetals(t) {
  for (const p of PETALS) {
    const age = t - p.release;
    if (age <= 0 || age > p.life) continue;
    const q = STRANDS[p.ro.k].pts[p.ro.i];
    const x = q[0] + p.vx * age + Math.sin(age * p.sf + p.rot) * p.sw;
    const y = q[1] + p.fall * age + 20 * age * age;
    if (y > H + 20) continue;
    const alpha = Math.min(1, age * 2) * (1 - ease((age - p.life + 2) / 2));
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(p.rot + age * p.rs);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#d0263a';
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }
}

function drawWall(t) {
  drawSky(t);
  drawHills(t);
  drawTrees(t);
  drawGround(t);
  drawRuins(t);
  drawLanterns(t);
  drawLightning(t);
  drawPulse(t);
  drawRoseGlow(t);
  drawFireflies(t);
  drawVignette();
}

function renderAt(t) {
  t = ((t % DURATION) + DURATION) % DURATION;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  if (!NOBG) { ctx.save(); clipPoly(WALL); drawWall(t); ctx.restore(); }
  ctx.save();
  clipShape();
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  // the cross: warm wood that catches the sunset, then the lantern light, then the lightning
  ctx.fillStyle = mixc([70, 40, 18], [22, 14, 8], night(t));
  ctx.fillRect(0, 0, W, H);
  const lf = lightningFlash(t);
  if (lf > 0.01) { ctx.fillStyle = `rgba(190,160,255,${0.5 * lf})`; ctx.fillRect(0, 0, W, H); }
  for (const st of STRANDS) drawStrand(st, t);
  for (const ro of ROSES) {
    const st = STRANDS[ro.k];
    const p = ease((t - st.startDelay) / st.growDur);
    if (Math.floor(p * N) <= ro.i) continue;
    const q = st.pts[ro.i];
    const sway = Math.sin(t * 1.3 + ro.spin) * 0.03;
    drawRose(q[0], q[1], ro.size, ease((t - ro.bloomAt) / 2.2), ro.spin + sway, ro.rot);
  }
  ctx.restore();
  if (!NOBG) { ctx.save(); clipPoly(WALL); drawPetals(t); ctx.restore(); }
  // fade out at the end so the loop restarts cleanly
  const fade = ease((t - (DURATION - 2)) / 2);
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
window.renderAt = renderAt;
// ---- soundtrack: a mystical forest, synthesised with Web Audio and rendered offline.
// renderAudio() returns a 16-bit stereo WAV as base64; the render script muxes it into the MP4.
async function renderAudio() {

  // one gentle "forest" reverb: short exponentially-decaying noise impulse

  { const ir = ac.createBuffer(2, SR * 2.2, SR); for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3.2) * 0.4; } conv.buffer = ir; }
  const wet = ac.createGain(); wet.gain.value = 0.35; conv.connect(wet); wet.connect(master);
  const send = node => { node.connect(master); node.connect(conv); };
  const noiseBuf = (secs, brown) => {
    const b = ac.createBuffer(1, SR * secs, SR), d = b.getChannelData(0); let last = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w; }
    return b;
  };
  const src = (buf, loop = true) => { const s = ac.createBufferSource(); s.buffer = buf; s.loop = loop; return s; };
  const fade = (g, t0, t1, v) => { g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t1); };

  // wind: brown noise, slow swells, low-pass
  { const n = src(noiseBuf(8, true)); const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 0.7;
    const g = ac.createGain(); g.gain.value = 0;
    for (let t = 0; t < L; t += 0.5) g.gain.linearRampToValueAtTime(0.16 + 0.10 * Math.sin(t * 0.37) + 0.06 * Math.sin(t * 0.91 + 1), t + 0.5);
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.09; const lg = ac.createGain(); lg.gain.value = 180; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    n.connect(lp); lp.connect(g); send(g); n.start(); }
  // leaves: band-passed white noise in gusts
  { const n = src(noiseBuf(6, false)); const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 0.8;
    const g = ac.createGain(); g.gain.value = 0;
    for (let t = 0; t < L; t += 0.25) { const gust = Math.max(0, Math.sin(t * 0.52 + 0.8)) ** 3 * 0.07 + Math.max(0, Math.sin(t * 1.9 + 2)) ** 5 * 0.03; g.gain.linearRampToValueAtTime(gust + 0.012, t + 0.25); }
    n.connect(bp); bp.connect(g); send(g); n.start(); }
  // crickets: three chirpers at different rates, panned
  for (const [f, rate, pan, start] of [[4300, 22, -0.6, 0.2], [3900, 17, 0.5, 1.1], [4700, 27, 0.1, 2.3]]) {
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const trill = ac.createGain(); trill.gain.value = 0;
    const lfo = ac.createOscillator(); lfo.type = 'square'; lfo.frequency.value = rate; const lg = ac.createGain(); lg.gain.value = 0.5; const off = ac.createConstantSource(); off.offset.value = 0.5;
    lfo.connect(lg); lg.connect(trill.gain); off.connect(trill.gain); lfo.start(); off.start();
    const env = ac.createGain(); env.gain.value = 0;
    for (let t = start; t < L; t += 3.3) { env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(0.022, t + 0.3); env.gain.setValueAtTime(0.022, t + 1.6 + Math.sin(t) * 0.4); env.gain.linearRampToValueAtTime(0, t + 2.2); }
    const p = ac.createStereoPanner(); p.pan.value = pan;
    o.connect(trill); trill.connect(env); env.connect(p); p.connect(master); o.start(); }
  // owl: two soft hoots
  for (const t0 of [9.5, 21.0]) for (const [dt, len] of [[0, 0.55], [0.75, 0.9]]) {
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(400, t0 + dt); o.frequency.exponentialRampToValueAtTime(330, t0 + dt + len);
    const g = ac.createGain(); g.gain.setValueAtTime(0, t0 + dt); g.gain.linearRampToValueAtTime(0.09, t0 + dt + 0.12); g.gain.setValueAtTime(0.09, t0 + dt + len - 0.2); g.gain.linearRampToValueAtTime(0, t0 + dt + len);
    o.connect(g); send(g); o.start(t0 + dt); o.stop(t0 + dt + len + 0.1); }
  // thunder on the lightning
  { const n = src(noiseBuf(5, true), false); const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(260, TL); lp.frequency.exponentialRampToValueAtTime(70, TL + 4);
    const g = ac.createGain(); g.gain.setValueAtTime(0, TL); g.gain.linearRampToValueAtTime(0.9, TL + 0.08); g.gain.setValueAtTime(0.9, TL + 0.5); g.gain.exponentialRampToValueAtTime(0.001, TL + 4.5);
    n.connect(lp); lp.connect(g); send(g); n.start(TL); }
  // mystical pad: detuned voices, swelling in after the lightning, D minor, airy
  for (const [f, det, vol, pan] of [[146.8, 0, 0.05, -0.3], [220.0, 3, 0.035, 0.3], [349.2, -4, 0.025, -0.1], [293.7, 6, 0.02, 0.2]]) {
    const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = f; o.detune.value = det;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    const g = ac.createGain(); g.gain.setValueAtTime(0, 0); g.gain.setValueAtTime(0, TL + 0.6); g.gain.linearRampToValueAtTime(vol, TL + 6); g.gain.setValueAtTime(vol, L - 3); g.gain.linearRampToValueAtTime(0, L - 0.5);
    const trem = ac.createOscillator(); trem.frequency.value = 0.21 + f / 2000; const tg = ac.createGain(); tg.gain.value = vol * 0.35; trem.connect(tg); tg.connect(g.gain); trem.start();
    const p = ac.createStereoPanner(); p.pan.value = pan;
    o.connect(lp); lp.connect(g); g.connect(p); p.connect(master); p.connect(conv); o.start(); }
  // chimes as the roses open: sparse bell tones from a pentatonic set
  { const r = mulberry32(9); const notes = [587.3, 659.3, 783.99, 880, 1046.5, 1174.7];
    for (let t = T0 + 7.5; t < L - 4; t += 0.9 + r() * 1.6) {
      const f = notes[Math.floor(r() * notes.length)];
      for (const [mul, v] of [[1, 0.05], [2.76, 0.012], [5.4, 0.005]]) {
        const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f * mul;
        const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0005, t + 2.2 / mul);
        const p = ac.createStereoPanner(); p.pan.value = (r() - 0.5) * 1.2;
        o.connect(g); g.connect(p); p.connect(master); p.connect(conv); o.start(t); o.stop(t + 2.5); } } }
  // overall fade in / out to match the picture
  { const env = ac.createGain(); master.disconnect(); master.connect(env); env.connect(ac.destination);
    env.gain.setValueAtTime(0, 0); env.gain.linearRampToValueAtTime(1, 1.5); env.gain.setValueAtTime(1, L - 2); env.gain.linearRampToValueAtTime(0, L - 0.05); }

  const buf = await ac.startRendering();
  const n = buf.length, out = new DataView(new ArrayBuffer(44 + n * 4));
  const str = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); str(8, 'WAVE'); str(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
  out.setUint32(24, SR, true); out.setUint32(28, SR * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); str(36, 'data'); out.setUint32(40, n * 4, true);
  const l = buf.getChannelData(0), rr = buf.getChannelData(1);
  for (let i = 0, o = 44; i < n; i++, o += 4) { out.setInt16(o, Math.max(-1, Math.min(1, l[i])) * 32767, true); out.setInt16(o + 2, Math.max(-1, Math.min(1, rr[i])) * 32767, true); }
  const bytes = new Uint8Array(out.buffer); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
window.renderAudio = renderAudio;

window.DURATION = DURATION;
window.FPS = FPS;

// ---- live preview + WebM recorder (for use straight in a browser)
const params = new URLSearchParams(location.search);
if (!params.has('frame')) {
  let playing = true, t0 = performance.now(), tAt = 0;
  const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
  function loop() {
    if (playing) tAt = ((performance.now() - t0) / 1000) % DURATION;
    renderAt(tAt);
    scrub.value = tAt / DURATION;
    timeEl.textContent = tAt.toFixed(1) + ' s';
    requestAnimationFrame(loop);
  }
  document.getElementById('play').onclick = e => { playing = !playing; if (playing) t0 = performance.now() - tAt * 1000; e.target.textContent = playing ? 'Pause' : 'Play'; };
  scrub.oninput = () => { playing = false; document.getElementById('play').textContent = 'Play'; tAt = scrub.value * DURATION; };
  document.getElementById('rec').onclick = async () => {
    const status = document.getElementById('status');
    const stream = canvas.captureStream(FPS);
    const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 12e6 });
    const chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      a.download = (NOBG ? 'cross_vines_roses' : 'wall_cross_vines_roses') + '_1920x1080.webm';
      a.click();
      status.textContent = 'Saved vines_roses_1920x1080.webm';
    };
    playing = true; t0 = performance.now(); tAt = 0;
    rec.start();
    status.textContent = 'Recording one loop…';
    setTimeout(() => rec.stop(), DURATION * 1000);
  };
  loop();
}
